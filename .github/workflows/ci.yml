name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - filament: "^3.0"
            testbench: "8.*"
            php: "8.2"
          - filament: "^3.0"
            testbench: "9.*"
            php: "8.2"
          - filament: "^4.0"
            testbench: "10.*"
            php: "8.3"
          - filament: "^5.0"
            testbench: "10.*"
            php: "8.3"
          - filament: "^5.0"
            testbench: "11.*"
            php: "8.4"
    name: Filament ${{ matrix.filament }} / Testbench ${{ matrix.testbench }} / PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl
          coverage: none
      - name: Install
        run: |
          composer require "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies
      - run: vendor/bin/phpunit
